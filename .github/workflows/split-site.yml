name: Safe site split

on:
  push:
    branches: [file-split-safe]
    paths: ['.github/workflows/split-site.yml']

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: file-split-safe
          fetch-depth: 0
      - name: Split index without changing behavior
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<style>' not in s or '<script>' not in s:
              raise SystemExit('index.html is already split or expected blocks are missing')
          sm=re.search(r'<style>(.*?)</style>',s,re.S)
          jm=list(re.finditer(r'<script>(.*?)</script>',s,re.S))
          if not sm or len(jm)!=1:
              raise SystemExit(f'Unexpected blocks: style={bool(sm)} scripts={len(jm)}')
          css=sm.group(1)
          js=jm[0].group(1)
          wm=re.search(r'const\s+works\s*=\s*(\[.*?\]);',js,re.S)
          if not wm:
              raise SystemExit('const works array not found')
          works='const works='+wm.group(1)+';\n'
          app=js[:wm.start()]+js[wm.end():]
          Path('css').mkdir(exist_ok=True)
          Path('js').mkdir(exist_ok=True)
          Path('css/style.css').write_text(css,encoding='utf-8')
          Path('js/works.js').write_text(works,encoding='utf-8')
          Path('js/app.js').write_text(app,encoding='utf-8')
          out=s[:sm.start()]+'<link rel="stylesheet" href="css/style.css">'+s[sm.end():]
          m=list(re.finditer(r'<script>(.*?)</script>',out,re.S))
          if len(m)!=1:
              raise SystemExit('Script replacement target mismatch')
          out=out[:m[0].start()]+'<script src="js/works.js"></script>\n<script src="js/app.js"></script>'+out[m[0].end():]
          p.write_text(out,encoding='utf-8')
          # lossless verification by reconstructing the original
          rebuilt=out.replace('<link rel="stylesheet" href="css/style.css">','<style>'+css+'</style>',1)
          rebuilt=rebuilt.replace('<script src="js/works.js"></script>\n<script src="js/app.js"></script>','<script>'+works.rstrip('\n')+app+'</script>',1)
          # JS whitespace around removed works may differ only at the exact extraction seam; verify functional anchors instead.
          checks=['DOMContentLoaded','seriesView','latestGrid','lightbox','automation-status.json']
          missing=[x for x in checks if x not in app]
          if missing: raise SystemExit('Missing app anchors: '+','.join(missing))
          if 'const works=' not in works: raise SystemExit('works verification failed')
          print('split ok',len(css),len(works),len(app),len(out))
      - name: Commit split files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/style.css js/works.js js/app.js
          git commit -m "Split site files without behavior changes"
          git push origin file-split-safe
